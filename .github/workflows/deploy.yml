name: 🚀 Deploy Muse兑换码 to Cloudflare Pages

# 只手动触发：仓库 → Actions → 选中本工作流 → Run workflow
on:
  workflow_dispatch:

concurrency:
  group: deploy-muse-codes
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: 🏗️ Deploy to Cloudflare Pages
    runs-on: ubuntu-latest

    env:
      # 非敏感配置：想改名可以在仓库 Variables 里覆盖，或直接改这里
      PAGES_PROJECT: ${{ vars.PAGES_PROJECT || 'muse-codes' }}
      D1_NAME: ${{ vars.D1_NAME || 'muse-codes-db' }}
      # 凭证一律走仓库 Secrets，不写进代码
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}

    steps:
      - name: 🚚 检出代码仓库
        uses: actions/checkout@v4

      - name: ⚙ 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 📦 安装依赖
        run: npm ci

      - name: 📡 关闭 Wrangler 遥测
        run: npx wrangler telemetry disable

      - name: 🔐 校验并标准化 Secrets
        run: |
          trim() { printf '%s' "$1" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//'; }
          CLOUDFLARE_API_TOKEN=$(trim "$CLOUDFLARE_API_TOKEN")
          CLOUDFLARE_ACCOUNT_ID=$(trim "$CLOUDFLARE_ACCOUNT_ID")
          D1_DATABASE_ID=$(trim "$D1_DATABASE_ID")

          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "❌ 缺少仓库 Secret：CLOUDFLARE_API_TOKEN"; exit 1; }
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "❌ 缺少仓库 Secret：CLOUDFLARE_ACCOUNT_ID"; exit 1; }

          {
            echo "CLOUDFLARE_API_TOKEN=$CLOUDFLARE_API_TOKEN"
            echo "CLOUDFLARE_ACCOUNT_ID=$CLOUDFLARE_ACCOUNT_ID"
            echo "D1_DATABASE_ID=$D1_DATABASE_ID"
          } >> "$GITHUB_ENV"
          echo "✅ Secrets 校验通过"

      - name: 🐬 解析 D1 数据库（不存在则自动创建）
        id: d1
        run: |
          set -euo pipefail

          if [ -n "$D1_DATABASE_ID" ]; then
            echo "✅ 使用 Secret 指定的 D1 数据库：$D1_DATABASE_ID"
            echo "id=$D1_DATABASE_ID" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "🔍 查找 D1 数据库 $D1_NAME ..."
          DB_LIST=$(npx wrangler d1 list --json)

          if echo "$DB_LIST" | jq -e --arg n "$D1_NAME" '.[] | select(.name == $n)' >/dev/null; then
            echo "✅ 数据库已存在"
          else
            echo "⚠️ 数据库不存在，正在创建…"
            npx wrangler d1 create "$D1_NAME"
          fi

          DB_ID=$(npx wrangler d1 list --json | jq -r --arg n "$D1_NAME" '.[] | select(.name == $n) | .uuid')
          [ -n "$DB_ID" ] && [ "$DB_ID" != "null" ] || { echo "❌ 无法获取 D1 数据库 ID"; exit 1; }

          echo "✅ D1 数据库 ID：$DB_ID"
          echo "id=$DB_ID" >> "$GITHUB_OUTPUT"

      - name: 🔗 注入 D1 绑定到 wrangler.toml
        run: |
          sed -i "s|^database_id = .*|database_id = \"${{ steps.d1.outputs.id }}\"|" wrangler.toml
          grep -n "database_id" wrangler.toml

      - name: 🗄️ 初始化 / 更新 D1 表结构
        run: npx wrangler d1 execute "${{ steps.d1.outputs.id }}" --remote --file=./schema.sql

      - name: 🏗️ 确保 Pages 项目存在
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PAGES_PROJECT")

          if [ "$STATUS" = "200" ]; then
            echo "✅ Pages 项目 $PAGES_PROJECT 已存在，跳过创建"
          elif [ "$STATUS" = "404" ]; then
            echo "⚠️ Pages 项目不存在，正在创建…"
            npx wrangler pages project create "$PAGES_PROJECT" --production-branch main
          else
            echo "❌ 查询 Pages 项目失败，HTTP $STATUS"
            exit 1
          fi

      - name: 🚀 部署到 Cloudflare Pages
        run: |
          npx wrangler pages deploy \
            --project-name "$PAGES_PROJECT" \
            --branch main \
            --commit-dirty=true
